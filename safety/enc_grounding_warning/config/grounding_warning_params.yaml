ukc:
  static_draft_m: 0.5
  length_m: 4.9
  beam_m: 2.0
  block_coefficient: 0.55
  squat_open_denominator: 100.0
  squat_confined_denominator: 50.0
  heel_allowance_m: 0.05
  trim_allowance_m: 0.03
  wave_allowance_m: 0.0
  ukc_required_abs_m: 0.3
  ukc_required_pct: 0.1
  u_depth_m: 0.1
  u_tide_m: 0.0
  u_draft_m: 0.02
  u_squat_m: 0.02
  u_wave_m: 0.0
  safety_factor: 1.0
  water_level_m: 0.0
  margin_safe_m: 0.1
  hysteresis_m: 0.1
  debounce_count: 3
  position_margin_m: 1.0
  lookahead_time_s: 300.0
  lookahead_distance_m: 1000.0
  sample_dt_s: 1.0
  sample_ds_m: 2.0
  corridor_half_width_extra_m: 2.0
  route_corridor_half_width_m: 10.0
  route_grid_resolution_m: 1.0
  route_depth_publish_hz: 1.0
  plan_immediate_min_interval_s: 0.2
  publish_hz: 2.0

# 网格 / 可视化发布开关（统一在此文件控制；默认 true = 保持历史始终发布行为）
# 关掉高资源项可显著降低 DDS/RViz/CPU：优先关 route_depth_markers、grounding_risk_grid、depth_grid
grid_publish:
  depth_grid: true              # 近场水深栅格 → safety/depth_grid（DepthGrid）
  grounding_risk_grid: true     # 近场触底风险栅格 → safety/grounding_risk_grid（GroundingRiskGrid，逐格算 UKC，很吃 CPU）
  route_depth_grid: true        # 航路走廊水深栅格 → safety/route_depth_grid（DepthGrid）
  route_depth_markers: true     # 航路水深 CUBE_LIST → safety/route_depth_markers（MarkerArray，RViz 最吃资源）
  current_risk_marker: true     # 当前船位风险球/文字 → safety/current_risk_marker（MarkerArray）
  grounding_markers: true       # 前瞻航线风险点 → safety/grounding_markers（MarkerArray）
