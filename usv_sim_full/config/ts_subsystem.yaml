# Optional CCS symmetric-heading profile for standalone COLREGS navigation.
# Pass through ts_params_file; launch supplies simulation clock and input/TF wiring.
# Parameter/geometry compatibility does not imply legacy trajectory equivalence.
ts_state_manager:
  ros__parameters:
    update_frequency: 10.0
    track_list_timeout: 1.0
    own_ship_state_timeout: 1.0
    threat_tcpa_horizon: 40.0
    threat_radius_scale: 2.0
    os_radius: 15.0
    global_frame: map

avoidance_point_node:
  ros__parameters:
    snapshot_timeout: 1.0
    max_request_position_delta: 3.0
    avoidance_radius_scale: 1.5 # Keep avoidance inside the larger threat-detection domain.
    point_extension_distance: 40.0  # Legacy (15m OS + 5m TS) * 2.
    heading_smoothing_alpha: 1.0
    smooth_initial_heading: false
    speed_tolerance: 0.0
    speed_sample_count: 5
    asymmetric_heading_smoothing: false
    heading_alpha_increase: 1.0
    heading_alpha_decrease: 0.15

barrier_node:
  ros__parameters:
    snapshot_timeout: 1.0
    max_request_position_delta: 3.0
    closing_segment_length: 999.0
    lateral_margin: 15.0           # Legacy first segment: TS radius + 15m.
