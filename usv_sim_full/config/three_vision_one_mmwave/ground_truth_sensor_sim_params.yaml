sim_mmwave_front:
  ros__parameters:
    input_topic: "/sim/ground_truth"
    target_topic: "/mmwave/front/targets"
    marker_topic: "/mmwave/front/markers"
    frame_id: "usv_1/mmwave_front_link"
    body_frame: "usv_1/base_link"
    use_tf_transform: true
    warn_on_tf_unavailable: false
    publish_markers: true
    radar_id: "mmwave_front"
    radar_yaw: 0.0
    radar_mount_x_m: 0.25
    radar_mount_y_m: 0.0
    fov_half_angle: 1.0471975512
    radial_noise_std: 0.5
    angle_noise_deg: 0.1
    velocity_resolution_m_s: 0.1
    size_jitter: 0.2
    motion_speed_threshold_m_s: 0.3
    publish_rate_hz: 15.0
