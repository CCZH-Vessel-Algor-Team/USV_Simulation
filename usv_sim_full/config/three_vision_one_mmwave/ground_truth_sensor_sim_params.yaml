# 3× vision (150° symmetric, 60° each) + 1× front mmwave (120° FoV).
# Node names must match three_sensor_sim.launch.py.
# Topics align with usv_late_fusion/config/event_fusion_three_sensor_io.yaml.
# /sim/ground_truth 为 map 坐标；感知 FoV/量测以 body_frame（usv_1/base_link）为原点。
# frame_id / body_frame 须与 full_config.yaml robot_N.name 前缀一致（默认 usv_1）。
# nav2_sim_three_vision_mmwave_bringup.launch.py 启动时会按 robot 名动态覆盖。

sim_vision_front:
  ros__parameters:
    input_topic: "/sim/ground_truth"
    detection_topic: "/vision/front/detections"
    publish_ai_objects: true
    ai_objects_topic: "/perception/camera/front/objects"
    image_width_px: 640
    image_height_px: 480
    marker_topic: "/vision/front/markers"
    frame_id: "usv_1/front_cam_link"
    body_frame: "usv_1/base_link"
    use_tf_transform: true
    warn_on_tf_unavailable: false
    publish_markers: true
    camera_id: "front"
    camera_yaw: 0.0
    camera_mount_x_m: 0.25
    camera_mount_y_m: 0.0
    fov_half_angle: 0.5235987756
    sigma_angle: 0.01
    distance_noise_offset: 0.02
    distance_noise_scale: 0.0002
    publish_rate_hz: 25.0
    detection_latency_min_sec: 0.030
    detection_latency_max_sec: 0.050
    vision_focal_length_px: 800.0

