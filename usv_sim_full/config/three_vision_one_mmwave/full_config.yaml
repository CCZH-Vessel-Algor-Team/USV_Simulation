# 三视觉 + 单毫米波 + Nav2 全栈仿真主配置。
# 配套 launch：nav2_sim_three_vision_mmwave_bringup.launch.py
# 数据链：scenario.ground_truth_sim → ground_truth_sensor_sim → usv_late_fusion
# 周邻目标：motion_mode=waypoint；gazebo_visual=true 时由 Gazebo 实体 pose 发布 /sim/ground_truth（单轨）。
environment:
  world_name: sydney_regatta
sensor_config_path: sensor_config.yaml
obstacles:
  fixed_list:
  - name: buoy_start
    type: buoy
    pose:
    - 15.0
    - 0.0
    - 0.0
    color: Green
scenario:
  dynamic_obstacles: []
  ground_truth_sim:
    enabled: false
    gazebo_visual: true
    motion_mode: waypoint
    # gazebo_visual=true → ground_truth_gazebo_entity_node；spawn 完成后从实体 pose 发布真值
    spawn_delay_sec: 10.0
    truth_velocity_lowpass_tau: 0.2
    update_dt: 0.02
    model_mass_kg: 50.0
    waypoint_kinematics: arc
    waypoint_omega_limit: 0.22
    waypoint_turn_radius_min_m: 10.0
    waypoint_align_threshold_deg: 12.0
    cmd_vel_omega_limit: 0.22
    cmd_vel_turn_radius_min_m: 10.0
    cmd_vel_align_threshold_deg: 12.0
    heading_sync_enabled: true
    heading_sync_interval_sec: 1.0
    gazebo_target_geometry: mesh_profile
    gazebo_mesh_profile: ../../description/models/target_ship/10m_mesh_profile.yaml
    cylinder_radius_cap_m: 4.0
    cylinder_height_cap_m: 5.0
    # 倾斜时 delete+respawn（不用 set_pose 拉回）；真值跳变 respawn 仍关闭以免 waypoint 误触发
    attitude_monitor_enabled: true
    attitude_max_roll_pitch_deg: 10.0
    attitude_max_z_error_m: 2.0
    attitude_monitor_interval_sec: 0.1
    attitude_respawn_cooldown_sec: 2.0
    spawn_thread_pool_size: 4
    fence_enabled: true
    fence_min_x: -450.0
    fence_max_x: 300.0
    fence_min_y: -120.0
    fence_max_y: 50.0
    fence_maintain_target_count: false
    collision_debounce_sec: 0.5
    world_service_wait_sec: 1.0
    reference_robot: usv_1
    reference_frame: map
    reference_tf_timeout_sec: 30.0
    frame_id: map
    waypoint_arrival_threshold_m: 0.5
    size_width_min: 3.6
    size_width_max: 3.6
    size_length_min: 10.0
    size_length_max: 10.0
    size_height_min: 2.0
    size_height_max: 2.0
    fixed_targets:
      # track1 南北向 x=-60，y∈[-10,22] 开阔水域；track2/3 东西向
      - track_id: 1
        speed: 3.5
        loop: true
        is_ais_matched: true
        matched_mmsi: 411000001
        waypoints:
          - [-60.0, -10.0]
          - [-60.0, 22.0]
      - track_id: 2
        speed: 3.0
        loop: true
        is_ais_matched: false
        waypoints:
          - [-50.0, -38.0]
          - [45.0, -38.0]
      - track_id: 3
        speed: 3.5
        loop: true
        is_ais_matched: true
        matched_mmsi: 411000003
        waypoints:
          - [-45.0, 10.0]
          - [50.0, 10.0]
visualization:
  launch_rviz: true
  enable_telemetry: true

robot_1:
  name: usv_1
  xacro_template: wamv_no_battery.urdf.xacro
  thruster_config: CUSTOM
  thrusters:
    enabled: true
  spawn_pose:
  - 0.0
  - 0.0
  - 0.5
  - 0.0
  - 0.0
  - 0.0
  overrides:
    visual_mesh: package://usv_sim_full/description/models/body-Base/mesh/M5_body.dae
    mass: 500.0
    inertia:
    - 100.0
    - 100.0
    - 200.0
    thruster_positions:
      thruster_pos_x: -2.373776
      thruster_pos_y_left: 0.7
      thruster_pos_y_right: -0.8
      thruster_pos_z: 0.318237
    ground_truth_enabled: true
  buoyancy_params:
    hull_length: 4.9
    hull_radius: 0.213
    fluid_level: 0.0
    xDotU: 0.0
    yDotV: 0.0
    nDotR: 0.0
    xU: 100.0
    xUU: 150.0
    yV: 100.0
    yVV: 100.0
    zW: 500.0
    kP: 300.0
    kPP: 600.0
    mQ: 900.0
    mQQ: 900.0
    nR: 800.0
    nRR: 800.0
  sensors:
  # 激光雷达：位姿与默认 full_config 一致
  - name: front_lidar
    type: lidar
    parent_link: base_link
    xyz:
    - 0.7
    - 0.0
    - 1.8
    rpy:
    - 0.0
    - 0.0
    - 0.0
    override_topic: /sensors/lidar/front_lidar/points
    enabled: true
  # 三视觉 150° 对称布局（REP-103：正 yaw 为 +X→+Y，左舷 +45°，右舷 -45°）
  - name: front_cam
    type: camera
    parent_link: base_link
    xyz:
    - 0.25
    - 0.0
    - 1.8
    rpy:
    - 0.0
    - 0.0
    - 0.0
    override_topic: /sensors/camera/front_cam/image_raw
    enabled: true
  - name: left_cam
    type: camera
    parent_link: base_link
    xyz:
    - 0.0
    - 0.25
    - 1.8
    rpy:
    - 0.0
    - 0.0
    - 0.7853981634
    override_topic: /sensors/camera/left_cam/image_raw
    enabled: true
  - name: right_cam
    type: camera
    parent_link: base_link
    xyz:
    - 0.0
    - -0.25
    - 1.8
    rpy:
    - 0.0
    - 0.0
    - -0.7853981634
    override_topic: /sensors/camera/right_cam/image_raw
    enabled: true
  # 独立三轴云台载荷，不参与三视觉固定相机的真值检测配置。
  - name: payload_gimbal
    type: gimbal
    parent_link: base_link
    xyz:
    - 0.45
    - 0.0
    - 2.2
    rpy:
    - 0.0
    - 0.0
    - 0.0
    image_topic: /sensors/camera/payload_gimbal/image_raw
    imu_topic: /sensors/imu/payload_gimbal/data
    control_topic: /gimbal/payload_gimbal/control
    enabled: true
  - name: imu_sensor
    type: imu
    parent_link: base_link
    xyz:
    - 0
    - 0.0
    - 1.8
    rpy:
    - 0.0
    - 0.0
    - 0.0
    override_topic: /sensors/imu/imu_sensor/data
    update_rate: 100
    enabled: true
  - name: gps_sensor
    type: gps
    parent_link: base_link
    xyz:
    - 0
    - 0.0
    - 1.9
    rpy:
    - 0.0
    - 0.0
    - 0.0
    override_topic: /sensors/gps/gps_sensor/data
    update_rate: 20
    enabled: true
  - name: mag_sensor
    type: magnetometer
    parent_link: base_link
    xyz:
    - 0.0
    - 0.0
    - 1.85
    rpy:
    - 0.0
    - 0.0
    - 0.0
    override_topic: /sensors/magnetometer/mag_sensor/data
    update_rate: 50
    enabled: true
  - name: baro_sensor
    type: barometer
    parent_link: base_link
    xyz:
    - 0.0
    - 0.0
    - 1.85
    rpy:
    - 0.0
    - 0.0
    - 0.0
    override_topic: /sensors/barometer/baro_sensor/fluid_pressure
    update_rate: 20
    enabled: true
  # 海事导航雷达：位姿与默认 full_config 一致
  - name: mari_radar
    type: maritime_radar
    parent_link: base_link
    xyz:
    - 0.0
    - 0.0
    - 2.0
    rpy:
    - 0.0
    - 0.0
    - 0.0
    override_topic: /sensors/radar/nav/sector
    enabled: true
  - name: mmwave_front
    type: mmwave_radar
    parent_link: base_link
    xyz:
    - 0.0
    - 0.0
    - 1.9
    rpy:
    - 0.0
    - 0.0
    - 0.0
    override_topic: /sensors/mmwave/mmwave_front/points
    enabled: true
