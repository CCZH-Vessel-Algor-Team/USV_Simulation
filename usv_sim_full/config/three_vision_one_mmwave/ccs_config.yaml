# 三视觉 + 单毫米波 + Nav2：CCS 开阔水域配置。
# 地理原点由 worlds/ccs_open_water.sdf 的 spherical_coordinates 定义：
# latitude=34.69149699539598, longitude=119.53601222131164。
environment:
  world_name: ccs_open_water

sensor_config_path: sensor_config.yaml

obstacles:
  fixed_list: []

scenario:
  dynamic_obstacles: []
  ground_truth_sim:
    enabled: false
    gazebo_visual: true
    motion_mode: waypoint
    spawn_delay_sec: 10.0
    truth_velocity_lowpass_tau: 0.2
    update_dt: 0.02
    model_mass_kg: 50.0
    waypoint_kinematics: arc
    waypoint_omega_limit: 0.22
    waypoint_turn_radius_min_m: 10.0
    waypoint_align_threshold_deg: 12.0
    cmd_vel_omega_limit: 0.22
    cmd_vel_turn_radius_min_m: 10.0
    cmd_vel_align_threshold_deg: 12.0
    heading_sync_enabled: true
    heading_sync_interval_sec: 1.0
    gazebo_target_geometry: mesh_profile
    gazebo_mesh_profile: ../../description/models/target_ship/10m_mesh_profile.yaml
    cylinder_radius_cap_m: 4.0
    cylinder_height_cap_m: 5.0
    attitude_monitor_enabled: true
    attitude_max_roll_pitch_deg: 10.0
    attitude_max_z_error_m: 2.0
    attitude_monitor_interval_sec: 0.1
    attitude_respawn_cooldown_sec: 2.0
    spawn_thread_pool_size: 4
    fence_enabled: true
    fence_min_x: -1000.0
    fence_max_x: 1000.0
    fence_min_y: -1000.0
    fence_max_y: 1000.0
    fence_maintain_target_count: false
    collision_debounce_sec: 0.5
    world_service_wait_sec: 1.0
    reference_robot: usv_1
    reference_frame: map
    reference_tf_timeout_sec: 30.0
    frame_id: map
    waypoint_arrival_threshold_m: 0.5
    size_width_min: 3.6
    size_width_max: 3.6
    size_length_min: 10.0
    size_length_max: 10.0
    size_height_min: 2.0
    size_height_max: 2.0
    fixed_targets: []

visualization:
  launch_rviz: true
  enable_telemetry: true

robot_1:
  name: usv_1
  xacro_template: wamv_no_battery.urdf.xacro
  thruster_config: CUSTOM
  thrusters:
    enabled: true
  spawn_pose:
  - 0.0
  - 0.0
  - 0.5
  - 0.0
  - 0.0
  - 0.0
  overrides:
    visual_mesh: package://usv_sim_full/description/models/body-Base/mesh/M5_body.dae
    mass: 500.0
    inertia:
    - 100.0
    - 100.0
    - 200.0
    thruster_positions:
      thruster_pos_x: -2.373776
      thruster_pos_y_left: 0.7
      thruster_pos_y_right: -0.8
      thruster_pos_z: 0.318237
    ground_truth_enabled: true
  buoyancy_params:
    hull_length: 4.9
    hull_radius: 0.213
    fluid_level: 0.0
    xDotU: 0.0
    yDotV: 0.0
    nDotR: 0.0
    xU: 100.0
    xUU: 150.0
    yV: 100.0
    yVV: 100.0
    zW: 500.0
    kP: 300.0
    kPP: 600.0
    mQ: 900.0
    mQQ: 900.0
    nR: 800.0
    nRR: 800.0
  sensors:
  - name: front_lidar
    type: lidar
    parent_link: base_link
    xyz:
    - 0.0
    - 0.0
    - 1.8
    rpy:
    - 0.0
    - 0.0
    - 0.0
    override_topic: /sensors/lidar/front_lidar/points
    enabled: true
  - name: front_cam
    type: camera
    parent_link: base_link
    xyz:
    - 0.25
    - 0.0
    - 1.8
    rpy:
    - 0.0
    - 0.0
    - 0.0
    override_topic: /sensors/camera/front_cam/image_raw
    enabled: true
  - name: left_cam
    type: camera
    parent_link: base_link
    xyz:
    - 0.0
    - 0.25
    - 1.8
    rpy:
    - 0.0
    - 0.0
    - 0.7853981634
    override_topic: /sensors/camera/left_cam/image_raw
    enabled: true
  - name: right_cam
    type: camera
    parent_link: base_link
    xyz:
    - 0.0
    - -0.25
    - 1.8
    rpy:
    - 0.0
    - 0.0
    - -0.7853981634
    override_topic: /sensors/camera/right_cam/image_raw
    enabled: true
  - name: imu_sensor
    type: imu
    parent_link: base_link
    xyz:
    - 0
    - 0.0
    - 1.8
    rpy:
    - 0.0
    - 0.0
    - 0.0
    override_topic: /sensors/imu/imu_sensor/data
    update_rate: 100
    enabled: true
  - name: gps_sensor
    type: gps
    parent_link: base_link
    xyz:
    - 0
    - 0.0
    - 1.9
    rpy:
    - 0.0
    - 0.0
    - 0.0
    override_topic: /sensors/gps/gps_sensor/data
    update_rate: 20
    enabled: true
  - name: mag_sensor
    type: magnetometer
    parent_link: base_link
    xyz:
    - 0.0
    - 0.0
    - 1.85
    rpy:
    - 0.0
    - 0.0
    - 0.0
    override_topic: /sensors/magnetometer/mag_sensor/data
    update_rate: 50
    enabled: true
  - name: baro_sensor
    type: barometer
    parent_link: base_link
    xyz:
    - 0.0
    - 0.0
    - 1.85
    rpy:
    - 0.0
    - 0.0
    - 0.0
    override_topic: /sensors/barometer/baro_sensor/fluid_pressure
    update_rate: 20
    enabled: true
  - name: mari_radar
    type: maritime_radar
    parent_link: base_link
    xyz:
    - 0.0
    - 0.0
    - 2.0
    rpy:
    - 0.0
    - 0.0
    - 0.0
    override_topic: /sensors/radar/nav/sector
    enabled: true
  - name: mmwave_front
    type: mmwave_radar
    parent_link: base_link
    xyz:
    - 0.0
    - 0.0
    - 1.9
    rpy:
    - 0.0
    - 0.0
    - 0.0
    override_topic: /sensors/mmwave/mmwave_front/points
    enabled: true
