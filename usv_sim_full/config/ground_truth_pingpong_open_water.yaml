# 开放水域 ping-pong 折返测试（sydney_regatta_open_water）。
#
# 单目标东西向直线往返，便于验证端点折返与非预期倒退。
#
# 启动：
#   ros2 launch usv_sim_full ground_truth_test.launch.py \
#     config_path:=$(ros2 pkg prefix usv_sim_full)/share/usv_sim_full/config/ground_truth_pingpong_open_water.yaml \
#     gz_headless:=true use_rviz:=false
#
# 自动化：
#   bash $(ros2 pkg prefix usv_sim_full)/share/usv_sim_full/tools/verify_entity_pingpong_open_water.sh

environment:
  world_name: sydney_regatta_open_water

obstacles:
  fixed_list: []

scenario:
  dynamic_obstacles: []
  ground_truth_sim:
    enabled: true
    gazebo_visual: true
    motion_mode: waypoint
    spawn_delay_sec: 5.0
    update_dt: 0.02
    model_mass_kg: 50.0
    cmd_vel_omega_limit: 0.15
    waypoint_omega_limit: 0.15
    waypoint_turn_radius_min_m: 8.0
    cmd_vel_turn_radius_min_m: 8.0
    waypoint_align_threshold_deg: 15.0
    cmd_vel_align_threshold_deg: 15.0
    world_service_wait_sec: 2.0
    attitude_monitor_enabled: false
    heading_sync_enabled: false
    spawn_thread_pool_size: 2
    gazebo_target_geometry: mesh_profile
    gazebo_mesh_profile: ../description/models/target_ship/10m_mesh_profile.yaml
    gazebo_model_prefix: gt_ctrv_
    frame_id: map
    reference_robot: ""
    reference_frame: map
    reference_tf_timeout_sec: 0.0
    waypoint_arrival_threshold_m: 1.0
    size_width_min: 3.6
    size_width_max: 3.6
    size_length_min: 10.0
    size_length_max: 10.0
    size_height_min: 2.0
    size_height_max: 2.0
    fixed_targets:
      - track_id: 1
        speed: 3.5
        loop: true
        is_ais_matched: true
        matched_mmsi: 411000001
        waypoints:
          - [-80.0, 0.0]
          - [80.0, 0.0]

visualization:
  launch_rviz: false
  enable_telemetry: false
