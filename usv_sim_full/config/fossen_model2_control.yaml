# Dedicated model-2 profile. No changes to existing CCS / WAM-V defaults.
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    progress_checker:
      required_movement_radius: 0.1
      movement_time_allowance: 30.0
    general_goal_checker:
      xy_goal_tolerance: 0.35
      yaw_goal_tolerance: 6.28
    FollowPath:
      plugin: nav2_colregs_alos_controller::ALOSController
      desired_linear_vel: 1.0
      fallback_linear_vel: 0.3
      max_linear_accel: 0.5
      max_angular_vel: 0.7
      # ALOS bounds commands around measured yaw rate; the inner loop must
      # respond quickly enough for this bound to represent useful acceleration.
      max_angular_accel: 0.5
      forward_dist: 2.0
      gamma: 0.0015
      beta_hat0: 0.0
      reset_beta_on_new_goal: true
      beta_reset_goal_dist_tolerance: 0.05
      max_angle_for_motion: 1.5707963267948966
      max_robot_pose_search_dist: 10.0
velocity_smoother:
  ros__parameters:
    max_velocity: [1.5, 0.0, 0.8]
    min_velocity: [-0.5, 0.0, -0.8]
    max_accel: [0.6, 0.0, 1.0]
    # Stop the 1 m/s boat within the small XY tolerance rather than retaining
    # the large-vessel smoothing ramp beyond the goal.
    max_decel: [-2.0, 0.0, -1.0]
/**:
  ros__parameters:
    control_rate: 50.0
    max_thrust: 125.0
    v_kp: 100.0
    v_ki: 160.0
    v_kd: 0.0
    w_kp: 500.0
    w_ki: 2000.0
    w_kd: 0.0
    odom_timeout: 0.5
    cmd_timeout: 0.5
    thrust_rate_limit: 0.0
