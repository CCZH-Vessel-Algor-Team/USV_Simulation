# 整船控制参数（ALOS 引导律 + cmd_vel→推力 PID）。
# 一个文件覆盖两个节点：controller_server.FollowPath（ALOS）和 cmd_vel_to_thruster（PID）。
# 在 Nav2 侧与 radar_nav2_param.yaml 合并加载（后者提供 costmap/planner 等完整配置，
# 本文件仅覆写 FollowPath 下的 ALOS 参数）；在 thrust bridge 侧作为节点参数直接传入。
#
# 默认 3 m/s 巡航工况。
# 启动：
#   control_params_file:=<path>/control_params.yaml

# --- ALOS 引导律 (FollowPath plugin) ---
controller_server:
  ros__parameters:
    speed_limit_topic: "_unused_speed_limit"
    FollowPath:
      plugin: "nav2_colregs_alos_controller::ALOSController"
      desired_linear_vel: 3.0
      max_linear_accel: 1.0
      max_angular_vel: 0.8
      max_angular_accel: 1.5
      forward_dist: 8.0
      gamma: 0.0003
      beta_hat0: 0.0
      reset_beta_on_new_path: true
      max_angle_for_motion: 0.8
      max_robot_pose_search_dist: 10.0

# --- 速度平滑器上限（默认 linear_x=0.5，必须覆盖） ---
velocity_smoother:
  ros__parameters:
    max_velocity: [5.5, 0.0, 2.5]
    max_accel: [2.0, 0.0, 3.0]
    max_decel: [-2.0, 0.0, -3.0]

# --- 差动推力 PID (cmd_vel → 左右推进器推力) ---
# 用 /** 通配符，无论 namespace 是否带 /usv_1/ 前缀均匹配
/**:
  ros__parameters:
    control_rate: 20.0
    max_thrust: 5000.0
    v_kp: 8000.0
    v_ki: 300.0
    v_kd: 0.0
    w_kp: 6000.0
    w_ki: 80.0
    w_kd: 500.0
    odom_timeout: 0.5
    cmd_timeout: 1.0
