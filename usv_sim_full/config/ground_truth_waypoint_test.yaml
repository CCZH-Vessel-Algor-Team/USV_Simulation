# Ground truth 固定航路 waypoint 模式隔离测试（sydney_regatta_open_water）。
#
# 启动：
#   ros2 launch usv_sim_full ground_truth_test.launch.py \
#     config_path:=$(ros2 pkg prefix usv_sim_full)/share/usv_sim_full/config/ground_truth_waypoint_test.yaml \
#     gz_headless:=true use_rviz:=false
#
# 性能门禁：
#   $(ros2 pkg prefix usv_sim_full)/share/usv_sim_full/tools/verify_ground_truth_waypoint_perf.sh

environment:
  world_name: sydney_regatta_open_water

obstacles:
  fixed_list: []

scenario:
  dynamic_obstacles: []
  ground_truth_sim:
    enabled: true
    gazebo_visual: true
    motion_mode: waypoint
    spawn_delay_sec: 5.0
    update_dt: 0.02
    model_mass_kg: 50.0
    cmd_vel_omega_limit: 0.12
    world_service_wait_sec: 2.0
    # waypoint 真值平滑移动，关闭 Gazebo 侧误触发的删除/重生（否则实体间歇消失）
    attitude_monitor_enabled: false
    truth_jump_respawn_enabled: false
    spawn_thread_pool_size: 4
    gazebo_target_geometry: mesh_profile
    gazebo_mesh_profile: ../description/models/target_ship/10m_mesh_profile.yaml
    gazebo_model_prefix: gt_ctrv_
    fence_enabled: false
    reference_robot: ""
    reference_frame: map
    reference_tf_timeout_sec: 0.0
    frame_id: map
    waypoint_arrival_threshold_m: 0.5
    size_width_min: 3.6
    size_width_max: 3.6
    size_length_min: 10.0
    size_length_max: 10.0
    size_height_min: 2.0
    size_height_max: 2.0
    fixed_targets:
      - track_id: 1
        speed: 4.0
        loop: true
        is_ais_matched: true
        matched_mmsi: 411000001
        waypoints:
          - [40.0, -20.0]
          - [80.0, 20.0]
          - [20.0, 60.0]
      - track_id: 2
        speed: 3.5
        loop: true
        is_ais_matched: false
        waypoints:
          - [-60.0, 40.0]
          - [-20.0, 80.0]
          - [30.0, 40.0]
      - track_id: 3
        speed: 5.0
        loop: true
        is_ais_matched: true
        matched_mmsi: 411000003
        waypoints:
          - [-40.0, -60.0]
          - [40.0, -60.0]
          - [40.0, -10.0]
          - [-40.0, -10.0]

visualization:
  launch_rviz: true
  enable_telemetry: false
