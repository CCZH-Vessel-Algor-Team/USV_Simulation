# M5 Nav2 motion overrides (navigation.nav2_overrides_file). Merge layer on
# top of usv_bringup config/navigation/nav2.yaml. Measured full-rig terminal
# speed is 3.961 m/s; cruise 3.0 leaves differential-thrust reserve. At 3 m/s,
# the steady planar yaw-rate capability is about 0.083 rad/s, not 0.5.
# The inherited behavior_server section below is unchanged and remains
# deferred; these controller/smoother limits do not certify Spin recovery.
controller_server:
  ros__parameters:
    FollowPath:
      desired_linear_vel: 3.0
      fallback_linear_vel: 0.8
      max_linear_accel: 2.0
      max_angular_vel: 0.08
      max_angular_accel: 0.3
      forward_dist: 10.0
      max_robot_pose_search_dist: 20.0
      gamma: 0.0015
      max_angle_for_motion: 1.5707963267948966
velocity_smoother:
  ros__parameters:
    # Keep the downstream reference capped at cruise, including the ALOS
    # final-carrot branch, which uses a distance-based speed reference.
    max_velocity: [3.0, 0.0, 0.08]
    min_velocity: [-1.0, 0.0, -0.08]
    max_accel: [2.0, 0.0, 0.3]
    max_decel: [-2.0, 0.0, -0.3]
behavior_server:
  ros__parameters:
    spin:
      min_rotational_vel: 0.10
      max_rotational_vel: 0.20
      time_budget: 40.0
    backup:
      time_budget: 30.0
    drive_on_heading:
      time_budget: 30.0
